<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: 'Segoe UI', sans-serif; width: 380px; padding: 12px; margin: 0; }
  h1 { font-size: 14px; margin: 0 0 10px; color: #6a1b9a; }
  button { width: 100%; margin: 4px 0; padding: 8px; border: none; border-radius: 5px; background: #6a1b9a; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #4a148c; }
  #res { font-size: 11px; margin-top: 10px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: 8px; border-radius: 5px; }
  #status { font-size: 12px; margin-top: 8px; color: #555; }
</style>
</head>
<body>
  <h1>Extractor Diario de Campo</h1>
  <button id="extract">Extraer datos (JSON)</button>
  <button id="copy">Copiar JSON</button>
  <button id="json">Descargar JSON</button>
  <div id="res">Abrí el Diario de Campo y hacé clic en "Extraer datos".</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
