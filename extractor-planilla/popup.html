<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: 'Segoe UI', sans-serif; width: 340px; padding: 12px; margin: 0; }
  h1 { font-size: 14px; margin: 0 0 10px; color: #1565c0; }
  button { width: 100%; margin: 4px 0; padding: 8px; border: none; border-radius: 5px; background: #1565c0; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #0d47a1; }
  #res { font-size: 12px; margin-top: 10px; max-height: 260px; overflow: auto; white-space: pre-wrap; background: #f5f5f5; padding: 8px; border-radius: 5px; }
  #status { font-size: 12px; margin-top: 8px; color: #555; }
</style>
</head>
<body>
  <h1>Extractor Planilla Master 2000</h1>
  <button id="extract">Extraer datos</button>
  <button id="csv">Exportar CSV</button>
  <button id="json">Exportar JSON</button>
  <div id="res">Abrí la Planilla de Resultados y hacé clic en "Extraer datos".</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
